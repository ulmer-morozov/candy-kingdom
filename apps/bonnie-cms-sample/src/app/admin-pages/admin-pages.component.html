ADMIN PAGES
<bonc-admin-controls #controls
                     [deviceControls]="true"
                     [editableGroup]="siteDataEditorGroup">
</bonc-admin-controls>

<bonc-editable-group #siteDataEditorGroup></bonc-editable-group>

<ul>
  <li *ngFor="let childPage of page.children"><a [routerLink]="['../', ('~' + childPage.url) | encodeURIComponent]">{{childPage.title | localize:controls.locale}}</a></li>
</ul>

<pre>{{page | json}}</pre>
