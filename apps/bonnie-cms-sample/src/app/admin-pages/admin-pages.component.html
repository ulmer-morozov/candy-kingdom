<bonc-admin-controls #controls
                     [deviceControls]="true"
                     [editableGroup]="pageEditorGroup" />

<nav *ngIf="page.children.length > 0" class="pages-nav">
  <ul>
    <li *ngFor="let childPage of page.children"><a [routerLink]="['../', ('~' + childPage.url) | encodeURIComponent]">{{childPage.title | localize:controls.locale}}</a></li>
  </ul>
</nav>

<bonc-editable-group #pageEditorGroup (saved)="save()" class="page-editor">

  <!-- todo: add form -->
  <!-- <publish-status-form [(ngModel)]="page.publishStatus"
                       [label]="'Publish status'"
                       editable
                       class="form-item page-title">

  </publish-status-form> -->

  <bonc-translation-form [(ngModel)]="page.title"
                         [locale]="controls.locale"
                         [field]="TextEditorField.Input"
                         [label]="'Page title (browser tab)'"
                         class="form-item page-title">
  </bonc-translation-form>

  <bonc-seo-form [(ngModel)]="page.openGraph"
                 [locale]="controls.locale"
                 [pageId]="page.id"
                 [label]="'Open Graph'"
                 class="form-item seo">
  </bonc-seo-form>

  <h2>Page Body</h2>

  <bonc-skeleton-editor [(ngModel)]="page.bones"
                        [map]="AdminBoneMap"
                        [templates]="templates"
                        [locale]="controls.locale"
                        [device]="controls.device">
  </bonc-skeleton-editor>

</bonc-editable-group>
