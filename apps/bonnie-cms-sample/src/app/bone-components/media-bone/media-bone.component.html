@if (bd.bone(); as bone) {
  @if (bone.title | localizationIsNotEmpty) {
    <div class="title" [innerHTML]="bone.title | localize"></div>
  }
  @if (bone.text | localizationIsNotEmpty) {
    <div class="text" [innerHTML]="bone.text | localize"></div>
  }
  <!-- todo: add link -->

  <!-- todo: pass img.alt -->
  <div class="media">
    <bon-media [src]="bone.media"></bon-media>
  </div>
}
