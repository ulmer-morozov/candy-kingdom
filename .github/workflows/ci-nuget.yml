name: Publish Package to NuGet
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # enable GitHub OIDC token issuance for this job
    steps:
    - uses: actions/checkout@master

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Get latest semver tag
      run: |
        TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
        VERSION=${TAG#v}
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: echo version
      run:  echo "VERSION=${{ env.VERSION }}"

    - name: Build Marcy
      run:  dotnet build libs/marcy/ --configuration Release -p:GeneratePackageOnBuild=true -p:Version=${{ env.VERSION }} -p:PackageVersion=${{ env.VERSION }}
    - name: Marcy Package Contents LS
      run:  cd libs/marcy/bin/Release/ && ls -la

    - name: Build Marcy-CMS
      run:  dotnet build libs/marcy-cms/ --configuration Release -p:GeneratePackageOnBuild=true -p:Version=${{ env.VERSION }} -p:PackageVersion=${{ env.VERSION }}
    - name: Marcy-CMS Package Contents LS
      run:  cd libs/marcy-cms/bin/Release/ && ls -la

    - name: Push Marcy NuGet Package
      run:  dotnet nuget push libs/marcy/bin/Release/CandyKingdom.Marcy.${{ env.VERSION }}.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

    - name: Push MarcyCms NuGet Package
      run:  dotnet nuget push libs/marcy-cms/bin/Release/CandyKingdom.MarcyCms.${{ env.VERSION }}.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
