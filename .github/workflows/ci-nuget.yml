name: Publish Package to NuGet
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@master
    - uses: nuget/setup-nuget@v2
      with:
        nuget-api-key: ${{ secrets.NuGetAPIKey }}
        nuget-version: '5.x'
        run: nuget restore CandyKingdom.sln

    - name: Get latest semver tag
      run: |
        TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
        VERSION=${TAG#v}
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Build
      run:  dotnet build libs/marcy/ --configuration Release -p:GeneratePackageOnBuild=true -p:Version=${VERSION} -p:PackageVersion=${VERSION}
    - name: LS
      run:  cd libs/marcy/bin/Release/ && ls -la
    # - name: Push NuGet Package
    #   run:  dotnet nuget push libs/marcy/bin/Release/CandyKingdom.Marcy.${VERSION}.nupkg --api-key ${{ secrets.NuGetAPIKey }}  --source https://api.nuget.org/v3/index.json
