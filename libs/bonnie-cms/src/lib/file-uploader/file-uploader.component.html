<div *ngIf="src === undefined || src.url === undefined || src?.url?.length === 0">Upload file</div>

<ng-content></ng-content>

<div (click)="selectFile($event)" class="media-container">
  <input #fileInput [accept]="fileTypeMask" (change)="onFileSelect(fileInput)" name="media" type="file" />
  <span *ngIf="isUploading"
        [style.clip-path]="clipStyle"
        [style.-webkit-clip-path]="clipStyle"
        class="loader"></span>

  <span *ngIf="isUploading" class="loader-text">
    <span *ngIf="progress < 1">{{100 * progress | number: '1.0-0'}}%</span>
    <span *ngIf="progress >= 1">converting</span>
  </span>
</div>
