<bonc-translation-input *ngIf="field === TextEditorField.Input"
                        (click)="showPopup()"
                        [text]="linkTitle"
                        [locale]="locale"
                        (startEditing)="onClick()"
                        (changed)="onChange()"
                        (blurred)="onBlur()">
</bonc-translation-input>

<bonc-translation-textarea *ngIf="field === TextEditorField.Textarea"
                           (click)="showPopup()"
                           [text]="linkTitle"
                           [locale]="locale"
                           [minRows]="minRows"
                           [maxRows]="maxRows"
                           (startEditing)="onClick()"
                           (changed)="onChange()"
                           (blurred)="onBlur()">
</bonc-translation-textarea>

<div *ngIf="popupIsShown">
  <div class="popup">
    <a (click)="hidePopup()" class="close">close</a>

    <label>Link
      <input [(ngModel)]="link[locale]"
             (click)="onClick()"
             (keyup)="onChange()"
             (blur)="onBlur()">
    </label>

  </div>
</div>
