<bonc-form-controls *ngIf="editable.value" [editable]="editable">
  <h2 *ngIf="label">{{label}}</h2>

  <div class="form-group">
    <label>Title</label>
    <bonc-translation-input [text]="editable.value.title"
                            [locale]="locale"
                            [style]="TranslationInputStyle.Form"
                            (startEditing)="editable.startEditing()"
                            (changed)="editable.updateDirty()"
                            (blurred)="editable.updateDirty()">
    </bonc-translation-input>
  </div>

  <div class="form-group">
    <label>Description</label>
    <bonc-translation-textarea [text]="editable.value.description"
                               [locale]="locale"
                               [style]="TranslationInputStyle.Form"
                               (startEditing)="editable.startEditing()"
                               (changed)="editable.updateDirty()"
                               (blurred)="editable.updateDirty()">
    </bonc-translation-textarea>
  </div>

  <div class="form-group">
    <label>Share image | 1200x630px</label>
    <!-- <simple-file-uploader *ngIf="locale === 'en'"
                          [(src)]="editable.value.ogImage.en"

                          [needDelete]="true"
                          (deleteFile)="deleteOgImage()"
                          [ratio]="1200/630"
                          [resToSrc]="ResToSrc"
                          (srcChange)="editable.startEditing(); editable.patchSave('ogImage',editable.value.ogImage)">
    </simple-file-uploader>

    <simple-file-uploader *ngIf="locale === 'ru'"
                          [(src)]="editable.value.ogImage.ru"
                          [forceUploadUrl]="ogImageUploadUrl"
                          [uploadType]="MediaType.Image"
                          [needDelete]="true"
                          (deleteFile)="deleteOgImage()"

                          [resToSrc]="ResToSrc"
                          (srcChange)="editable.startEditing(); editable.patchSave('ogImage',editable.value.ogImage)">
    </simple-file-uploader> -->

  </div>

</bonc-form-controls>
