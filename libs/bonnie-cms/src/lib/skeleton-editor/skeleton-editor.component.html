<ng-template #controls let-index='index'>
  <div [class.appearable]="index > 0 && index < bones.length" class="controls">
    @if (index < bones.length) {
      <div class="up-down">
        @if (index > 0) {
          <a (click)="moveDown(index - 1)" class="down">move down</a>
          <a (click)="moveUp(index)" class="up">move up</a>
        }
      </div>
    }
    <a (click)="templatesAreShown[index] = true" class="add">create</a>
    @if (index < bones.length) {
      <a (click)="removeBone(index)" class="remove">remove</a>
    }
  </div>

  @if (templatesAreShown[index]) {
    <div class="templates">
      @for (template of templates(); track template.title) {
        <a (click)="templatesAreShown[index] = false; createBone(index,template);">{{template.title}}</a>
      }
      <a (click)="templatesAreShown[index] = false">Close</a>
    </div>
  }
</ng-template>

<!-- todo: add trackby -->
@for (bone of bones; track $index) {
  <ng-container>
    <ng-container *ngTemplateOutlet="controls; context: {index: $index}"></ng-container>
  </ng-container>

  <bonc-bone-editor-container #boneEditorContainer
                              [map]="map()"
                              [bone]="bone"
                              [locale]="locale()"
                              [device]="device()"
                              (removed)="removeBone($index)"
                              (editing)="boneEditHandler($event)"
                              (saved)="boneChangeHandler($index, $event)">
  </bonc-bone-editor-container>
}

<ng-container *ngTemplateOutlet="controls; context: {index: bones.length}"></ng-container>
