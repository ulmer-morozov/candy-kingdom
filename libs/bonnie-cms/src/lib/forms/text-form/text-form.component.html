<bonc-form-controls [editable]="editable">
  @if (label()) {
    <label>{{label()}}</label>
  }
  @if (editable) {
    @switch (type()) {
      @case (TextInputStyle.SingleLine) {
          <input [(ngModel)]="editable.value"
                (click)="editable.startEditing()"
                (keyup)="editable.updateDirty()"
                (blur)="editable.updateDirty()" />
      }
      @case (TextInputStyle.MultiLine) {
          <textarea [(ngModel)]="editable.value"
                    (click)="editable.startEditing()"
                    (keyup)="editable.updateDirty()"
                    (blur)="editable.updateDirty()">
          </textarea>
      }
    }
  }
</bonc-form-controls>
