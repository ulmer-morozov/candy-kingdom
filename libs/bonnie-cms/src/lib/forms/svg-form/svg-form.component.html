<bonc-form-controls [editable]="editable">
  @if (label()) {
    <label>{{label()}}</label>
  }
  <bonc-file-uploader [src]="editable.value"
                      [uploadTypes]="[SvgMime]"
                      [uploadUrlMap]="uploadMap()"
                      (srcChange)="onFileUploaded($event)">
    @if (editable.value?.url?.length ?? 0 > 0) {
      <img [src]="editable.value?.url" />
    }
  </bonc-file-uploader>

  @if (editable.value?.url?.length ?? 0 > 0) {
    <a [href]="editable.value!.url" download target="_blank">Download</a>
  }

</bonc-form-controls>
