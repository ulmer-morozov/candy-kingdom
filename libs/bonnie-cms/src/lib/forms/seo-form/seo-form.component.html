@if (editable.value !== undefined && editable.value !== null) {
  <bonc-form-controls [editable]="editable">
    @if (label()) {
      <h2>{{label()}}</h2>
    }

    <div class="form-group">
      <label>Title</label>
      <bonc-translation-input [text]="editable.value.title"
                              [locale]="locale()"
                              (startEditing)="editable.startEditing()"
                              (changed)="editable.updateDirty()"
                              (blurred)="editable.updateDirty()">
      </bonc-translation-input>
    </div>

    <div class="form-group">
      <label>Description</label>
      <bonc-translation-textarea [text]="editable.value.description"
                                 [locale]="locale()"
                                 (startEditing)="editable.startEditing()"
                                 (changed)="editable.updateDirty()"
                                 (blurred)="editable.updateDirty()">
      </bonc-translation-textarea>
    </div>

    <div class="form-group">
      <label>Share image | 1200x630</label>

      <bonc-file-uploader [src]="editable.value.image[locale()]"
                          [uploadTypes]="['image/png', 'image/jpeg']"
                          [uploadUrlMap]="uploadMap"
                          (srcChange)="replaceImage($event)">
        @if (editable.value.image[locale()]?.url?.length ?? 0 > 0) {
          <img [src]="editable.value.image[locale()].url" />
        }
      </bonc-file-uploader>

      @if (editable.value.image[locale()]?.url?.length ?? 0 > 0) {
        <a [href]="editable.value.image[locale()].url" download target="_blank">Download</a>
      }
    </div>

  </bonc-form-controls>
} @else {
  <div>Editable Value canot be null or undefined</div>
}
