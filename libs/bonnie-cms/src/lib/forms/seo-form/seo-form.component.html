<bonc-form-controls *ngIf="editable.value" [editable]="editable">
  <h2 *ngIf="label">{{label}}</h2>

  <div class="form-group">
    <label>Title</label>
    <bonc-translation-input [text]="editable.value.title"
                            [locale]="locale"
                            (startEditing)="editable.startEditing()"
                            (changed)="editable.updateDirty()"
                            (blurred)="editable.updateDirty()">
    </bonc-translation-input>
  </div>

  <div class="form-group">
    <label>Description</label>
    <bonc-translation-textarea [text]="editable.value.description"
                               [locale]="locale"
                               (startEditing)="editable.startEditing()"
                               (changed)="editable.updateDirty()"
                               (blurred)="editable.updateDirty()">
    </bonc-translation-textarea>
  </div>

  <div class="form-group">
    <label>Share image | 1200x630</label>

    <bonc-one-image-form [(ngModel)]="editable.value.image"
                         [uploadUrl]="'/api/admin/upload/image?width=' + imageWidth + '&height='+imageHeight + '&format=image/jpeg'"
                         [locale]="locale">
    </bonc-one-image-form>

  </div>

</bonc-form-controls>

<div *ngIf="!editable.value">Editable Value canot be null or undefined</div>
