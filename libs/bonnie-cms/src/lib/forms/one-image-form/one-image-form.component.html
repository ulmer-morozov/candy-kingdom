<bonc-form-controls [editable]="editable">
  @if (label()) {
    <label>{{ label() }}</label>
  }
  <bonc-file-uploader
    [src]="editable.value"
    [uploadTypes]="mimeTypes()"
    [uploadUrlMap]="uploadMap()"
    (srcChange)="onFileUploaded($event)"
  >
    @let url = editable.value?.url;
    @if (url) {
      <img [src]="url" />
    }
  </bonc-file-uploader>

  @let downloadUrl = editable.value?.url;
  @if (downloadUrl) {
    <a [href]="downloadUrl" download target="_blank">Download</a>
  }
</bonc-form-controls>
