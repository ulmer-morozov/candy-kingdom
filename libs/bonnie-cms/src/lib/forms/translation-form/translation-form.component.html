@if (editable.value) {
  <bonc-form-controls [editable]="editable">
    @if (label()) {
      <label>{{label()}}</label>
    }

    @switch (field()) {
      @case (TextEditorField.Input) {
        <bonc-translation-input [text]="editable.value"
                                [locale]="locale()"
                                (startEditing)="editable.startEditing()"
                                (changed)="editable.updateDirty()"
                                (blurred)="editable.updateDirty()">
        </bonc-translation-input>
      }
      @case (TextEditorField.Textarea) {
        <bonc-translation-textarea [text]="editable.value"
                                   [minRows]="2"
                                   [locale]="locale()"
                                   (startEditing)="editable.startEditing()"
                                   (changed)="editable.updateDirty()"
                                   (blurred)="editable.updateDirty()">
        </bonc-translation-textarea>
      }
    }
  </bonc-form-controls>
} @else {
  <div>Editable value canot be undefined</div>
}
