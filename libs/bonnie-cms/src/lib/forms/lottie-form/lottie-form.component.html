<bonc-form-controls [editable]="editable">
  @if (label()) {
    <label>{{ label() }}</label>
  }
  <bonc-file-uploader
    [src]="editable.value"
    [uploadTypes]="[LottieMimeType]"
    [uploadUrlMap]="uploadMap()"
    (srcChange)="onFileUploaded($event)"
  >
    @if (animOptions) {
      <ng-lottie [options]="animOptions"></ng-lottie>
    }
  </bonc-file-uploader>

  @let downloadUrl = editable.value?.url;
  @if (downloadUrl) {
    <a [href]="downloadUrl" download target="_blank">Download</a>
  }
</bonc-form-controls>
