@if (sources().length > 0) {
  <div [class.knownRatio]="src.ratio() > 0 && objectFit() === MarcyObjectFit.Original"
       [class.cover]="objectFit() === MarcyObjectFit.Cover"
       [class.contain]="objectFit() === MarcyObjectFit.Contain"
       [class.loaded]="status() === MediaStatus.Loaded"
       class="picture-container">

    <ng-template #pictureTemplate>
      <picture>
        @for (source of sources(); track $index) {
          <source [srcset]="source.srcSet"
                  [attr.media]="source.media.length > 0 ? source.media : undefined"
                  [attr.type]="source.mime.length > 0 ? source.mime : undefined"
                  [attr.sizes]="source.sizes.length > 0 ? source.sizes : undefined" />
        }
        <img [src]="defaultSrc()" (load)="onLoad()" alt="" />
      </picture>
    </ng-template>

    @if (device.isSSR) {
      <noscript>
        <ng-container *ngTemplateOutlet="pictureTemplate"></ng-container>
      </noscript>
    } @else {
      <bon-intersection #intersectionZone [session]="src">
        @if (intersectionZone.intersectedOnce()) {
          <ng-container *ngTemplateOutlet="pictureTemplate"></ng-container>
        }
      </bon-intersection>
    }

    @if (src.ratio() > 0 && objectFit() === MarcyObjectFit.Original) {
      <div [style.padding-top]="100 / src.ratio() +'%'"></div>
    }
  </div>
}
